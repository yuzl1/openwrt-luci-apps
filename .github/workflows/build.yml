name: Build ipk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test the standalone DDNS updater
        run: |
          chmod +x tests/test-ddns-lite.sh tests/mock/bin/*
          tests/test-ddns-lite.sh

      - name: Build the architecture independent packages
        run: |
          chmod +x build-ipk.sh
          ./build-ipk.sh

      - name: Set up Go for Tailscale
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Build Tailscale ARMv7 core
        run: |
          chmod +x build-tailscale.sh
          ./build-tailscale.sh

      - name: Generate package index
        run: |
          python3 build-index.py dist
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-luci-apps-ipk
          path: |
            dist/*.ipk
            dist/Packages
            dist/Packages.gz
          if-no-files-found: error

      - name: Prepare feed directory
        run: |
          mkdir -p publish/23.05
          cp dist/*.ipk dist/Packages dist/Packages.gz publish/23.05/
          cp feed/README.md publish/23.05/README.md
          cp feed/index.html publish/index.html
          ls -l publish
          ls -l publish/23.05

      - name: Build usign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential
          git clone --depth 1 https://github.com/openwrt/usign.git /tmp/usign
          cmake -S /tmp/usign -B /tmp/usign/build > /dev/null
          cmake --build /tmp/usign/build --parallel > /dev/null
          sudo install -m755 /tmp/usign/build/usign /usr/local/bin/usign
          usign -V 2>&1 | head -2 || true

      - name: Sign the package index
        env:
          USIGN_SECRET: ${{ secrets.USIGN_SECRET }}
        run: |
          if [ -z "$USIGN_SECRET" ]; then
            echo "USIGN_SECRET is not set - publishing an unsigned feed"
            exit 0
          fi
          printf '%s\n' "$USIGN_SECRET" > /tmp/feed.sec
          usign -S -m publish/23.05/Packages -s /tmp/feed.sec -x publish/23.05/Packages.sig
          rm -f /tmp/feed.sec
          for key in keys/*.pub; do
            echo "signing key: $(usign -F -p "$key") ($key)"
          done
          ls -l publish

      - name: Publish opkg feed to gh-pages
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/gh-pages
          # The 23.05 feed moved under /23.05; drop the old root-level copies.
          rm -f /tmp/gh-pages/Packages /tmp/gh-pages/Packages.gz \
                /tmp/gh-pages/Packages.sig /tmp/gh-pages/README.md \
                /tmp/gh-pages/*.ipk
          rm -rf /tmp/gh-pages/23.05
          cp -f publish/index.html /tmp/gh-pages/index.html
          cp -a publish/23.05 /tmp/gh-pages/23.05
          cd /tmp/gh-pages
          git add -A
          git commit -m "Update landing page and 23.05 feed" || true
          git push origin gh-pages

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          generate_release_notes: true

      - name: Clean old ipk releases
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def api(path, method="GET"):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                  })
              resp = urllib.request.urlopen(req)
              return json.load(resp) if method == "GET" else resp.read()

          releases = api("/releases?per_page=100")
          kept = False
          for r in releases:
              tag = r["tag_name"]
              if not tag.startswith("v"):
                  continue
              if not kept:
                  kept = True
                  print("keep", tag)
                  continue
              print("delete release", tag)
              try:
                  api(f"/releases/{r['id']}", "DELETE")
                  api(f"/git/refs/tags/{tag}", "DELETE")
              except urllib.error.HTTPError as e:
                  print("skip", tag, e.code)
          PY
