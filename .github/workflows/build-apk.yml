name: Build apk (25.12)

on:
  push:
    branches: [ openwrt-25.12 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download apk-tools-static
        run: |
          curl -fL -o /tmp/apk-tools-static.apk \
            https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64/apk-tools-static-3.0.8-r0.apk
          mkdir -p /tmp/apk-static
          tar -xzf /tmp/apk-tools-static.apk -C /tmp/apk-static
          /tmp/apk-static/sbin/apk.static --version
          echo "APK_BIN=/tmp/apk-static/sbin/apk.static" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Prepare apk signing key
        env:
          APK_SIGN_KEY_25_12: ${{ secrets.APK_SIGN_KEY_25_12 }}
        run: |
          if [ -n "$APK_SIGN_KEY_25_12" ]; then
            printf '%s\n' "$APK_SIGN_KEY_25_12" > /tmp/yuzl1-apk-25.12.pem
            chmod 600 /tmp/yuzl1-apk-25.12.pem
            echo "APK_SIGN_KEY_FILE=/tmp/yuzl1-apk-25.12.pem" >> "$GITHUB_ENV"
          else
            echo "APK_SIGN_KEY_25_12 is not set - building unsigned packages"
          fi

      - name: Build apk packages
        run: |
          chmod +x build-apk.sh
          ./build-apk.sh

      - name: Generate APKINDEX
        run: |
          cd dist-apk
          # apk mkpkg produces v3 packages; the v2 "apk index" applet cannot
          # read them. Use mkndx. When a signing key is configured, sign the
          # index too so clients do not need --allow-untrusted.
          if [ -n "$APK_SIGN_KEY_FILE" ]; then
            "$APK_BIN" mkndx --allow-untrusted --sign-key "$APK_SIGN_KEY_FILE" \
              -o APKINDEX.tar.gz *.apk
          else
            "$APK_BIN" mkndx --allow-untrusted -o APKINDEX.tar.gz *.apk
          fi
          ls -l

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-luci-apps-apk
          path: |
            dist-apk/*.apk
            dist-apk/APKINDEX.tar.gz
            dist-apk/yuzl1-apk-25.12.pem
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-25.12-${{ github.run_number }}
          name: apk 25.12 build ${{ github.run_number }}
          prerelease: true
          files: |
            dist-apk/*.apk
            dist-apk/APKINDEX.tar.gz
            dist-apk/yuzl1-apk-25.12.pem

      - name: Clean old apk releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def api(path, method="GET"):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                  })
              resp = urllib.request.urlopen(req)
              return json.load(resp) if method == "GET" else resp.read()

          releases = api("/releases?per_page=100")
          kept = False
          for r in releases:
              tag = r["tag_name"]
              if not tag.startswith("apk-25.12-"):
                  continue
              if not kept:
                  kept = True
                  print("keep", tag)
                  continue
              print("delete release", tag)
              try:
                  api(f"/releases/{r['id']}", "DELETE")
                  api(f"/git/refs/tags/{tag}", "DELETE")
              except urllib.error.HTTPError as e:
                  print("skip", tag, e.code)
          PY

      - name: Publish apk feed to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/gh-pages
          # apk treats a directory repository as <repo>/<arch>/APKINDEX.tar.gz.
          rm -rf /tmp/gh-pages/25.12/arm_cortex-a7_neon-vfpv4
          mkdir -p /tmp/gh-pages/25.12/arm_cortex-a7_neon-vfpv4
          rm -f /tmp/gh-pages/25.12/*.apk /tmp/gh-pages/25.12/APKINDEX.tar.gz
          cp dist-apk/*.apk dist-apk/APKINDEX.tar.gz \
            /tmp/gh-pages/25.12/arm_cortex-a7_neon-vfpv4/
          cp dist-apk/yuzl1-apk-25.12.pem /tmp/gh-pages/25.12/
          cd /tmp/gh-pages
          git add 25.12
          git commit -m "25.12: update apk feed" || true
          git push origin gh-pages
