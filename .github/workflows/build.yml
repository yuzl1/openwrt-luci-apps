name: Build ipk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test the standalone DDNS updater
        run: |
          chmod +x tests/test-ddns-lite.sh tests/mock/bin/*
          tests/test-ddns-lite.sh

      - name: Build the architecture independent packages
        run: |
          chmod +x build-ipk.sh
          ./build-ipk.sh

      - name: Set up Go for Tailscale
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Build Tailscale ARMv7 core
        run: |
          chmod +x build-tailscale.sh
          ./build-tailscale.sh

      - name: Generate package index
        run: |
          python3 build-index.py dist
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-luci-apps-ipk
          path: |
            dist/*.ipk
            dist/Packages
            dist/Packages.gz
          if-no-files-found: error

      - name: Prepare feed directory
        run: |
          mkdir -p publish/23.05
          cp dist/*.ipk dist/Packages dist/Packages.gz publish/23.05/
          cp feed/README.md publish/23.05/README.md
          cp feed/index.html publish/index.html
          ls -l publish
          ls -l publish/23.05

      - name: Build usign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential
          git clone --depth 1 https://github.com/openwrt/usign.git /tmp/usign
          cmake -S /tmp/usign -B /tmp/usign/build > /dev/null
          cmake --build /tmp/usign/build --parallel > /dev/null
          sudo install -m755 /tmp/usign/build/usign /usr/local/bin/usign
          usign -V 2>&1 | head -2 || true

      - name: Sign the package index
        env:
          USIGN_SECRET: ${{ secrets.USIGN_SECRET }}
        run: |
          if [ -z "$USIGN_SECRET" ]; then
            echo "USIGN_SECRET is not set - publishing an unsigned feed"
            exit 0
          fi
          printf '%s\n' "$USIGN_SECRET" > /tmp/feed.sec
          usign -S -m publish/Packages -s /tmp/feed.sec -x publish/Packages.sig
          cp publish/Packages.sig publish/23.05/Packages.sig
          rm -f /tmp/feed.sec
          for key in keys/*.pub; do
            echo "signing key: $(usign -F -p "$key") ($key)"
          done
          ls -l publish

      - name: Publish opkg feed to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          # Only the landing page and the 23.05 feed belong to this workflow;
          # keep the 25.12 apk feed published by the other workflow.
          force_orphan: true
          keep_files: |
            25.12

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          generate_release_notes: true
