name: Build apk (25.12)

on:
  push:
    branches: [ openwrt-25.12 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download apk-tools-static
        run: |
          curl -fL -o /tmp/apk-tools-static.apk \
            https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64/apk-tools-static-3.0.8-r0.apk
          mkdir -p /tmp/apk-static
          tar -xzf /tmp/apk-tools-static.apk -C /tmp/apk-static
          /tmp/apk-static/sbin/apk.static --version
          echo "APK_BIN=/tmp/apk-static/sbin/apk.static" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Build apk packages
        run: |
          chmod +x build-apk.sh
          ./build-apk.sh

      - name: Generate APKINDEX
        run: |
          cd dist-apk
          "$APK_BIN" index -o APKINDEX.tar.gz *.apk
          ls -l

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-luci-apps-apk
          path: |
            dist-apk/*.apk
            dist-apk/APKINDEX.tar.gz
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-25.12-${{ github.run_number }}
          name: apk 25.12 build ${{ github.run_number }}
          prerelease: true
          files: |
            dist-apk/*.apk
            dist-apk/APKINDEX.tar.gz

      - name: Publish apk feed to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/gh-pages
          mkdir -p /tmp/gh-pages/25.12
          rm -f /tmp/gh-pages/25.12/*
          cp dist-apk/*.apk dist-apk/APKINDEX.tar.gz /tmp/gh-pages/25.12/
          cd /tmp/gh-pages
          git add 25.12
          git commit -m "25.12: update apk feed" || true
          git push origin gh-pages
